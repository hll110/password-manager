version: '3.8'

services:
  password-manager:
    build: .
    container_name: password-manager
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      # 持久化数据库和密钥
      - ./db:/app/db
      # 可选：持久化日志
      - ./logs:/app/logs
    environment:
      - FLASK_ENV=production
      - TZ=Asia/Shanghai
    networks:
      - password-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/api/stats"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  password-network:
    driver: bridge

# 使用 bind mount 将容器数据映射到宿主机当前目录下的 db 文件夹
# 请确保宿主机 db 目录存在且有写权限
