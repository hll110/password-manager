<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>密码管理器 - 安全便捷的账号管理工具</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="app">
        <!-- 顶部导航 -->
        <header class="header">
            <div class="header-left">
                <button class="btn-icon" onclick="toggleSidebar()">
                    <i class="fas fa-bars"></i>
                </button>
                <h1 class="logo">
                    <i class="fas fa-shield-alt"></i>
                    <span>密码管理器</span>
                </h1>
            </div>
            <div class="header-right">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" placeholder="搜索账号..." oninput="searchAccounts()">
                </div>
                <button class="btn-primary" onclick="showAddModal()">
                    <i class="fas fa-plus"></i>
                    <span>添加账号</span>
                </button>
            </div>
        </header>

        <div class="main-container">
            <!-- 侧边栏 -->
            <aside class="sidebar" id="sidebar">
                <div class="sidebar-header">
                    <h2>分类</h2>
                    <button class="btn-icon" onclick="showAddCategoryModal()">
                        <i class="fas fa-plus"></i>
                    </button>
                </div>
                <ul class="category-list" id="categoryList">
                    <!-- 分类列表动态加载 -->
                </ul>
                
                <div class="sidebar-stats">
                    <h3>统计</h3>
                    <div class="stat-item">
                        <span class="stat-label">总账号数</span>
                        <span class="stat-value" id="totalAccounts">0</span>
                    </div>
                </div>
            </aside>

            <!-- 主内容区 -->
            <main class="main-content">
                <!-- 欢迎卡片 -->
                <div class="welcome-card" id="welcomeCard">
                    <div class="welcome-icon">
                        <i class="fas fa-lock"></i>
                    </div>
                    <h2>安全存储您的账号密码</h2>
                    <p>所有数据本地加密存储，保护您的隐私安全</p>
                    <button class="btn-primary" onclick="showAddModal()">
                        <i class="fas fa-plus"></i>
                        添加第一个账号
                    </button>
                </div>

                <!-- 账号列表 -->
                <div class="accounts-grid" id="accountsGrid">
                    <!-- 账号卡片动态加载 -->
                </div>
            </main>
        </div>

        <!-- 添加/编辑账号弹窗 -->
        <div class="modal" id="accountModal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 id="modalTitle">添加账号</h2>
                    <button class="btn-icon" onclick="closeModal('accountModal')">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <form id="accountForm" onsubmit="saveAccount(event)">
                    <input type="hidden" id="accountId">
                    
                    <div class="form-group">
                        <label>标题 *</label>
                        <input type="text" id="accountTitle" required placeholder="例如：GitHub、微信">
                    </div>
                    
                    <div class="form-group">
                        <label>用户名/邮箱</label>
                        <input type="text" id="accountUsername" placeholder="用户名或邮箱地址">
                    </div>
                    
                    <div class="form-group">
                        <label>密码</label>
                        <div class="password-input">
                            <input type="password" id="accountPassword" placeholder="密码">
                            <button type="button" class="btn-icon" onclick="togglePassword()">
                                <i class="fas fa-eye"></i>
                            </button>
                            <button type="button" class="btn-icon" onclick="generatePassword()">
                                <i class="fas fa-key"></i>
                            </button>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label>网址</label>
                        <input type="url" id="accountUrl" placeholder="https://...">
                    </div>
                    
                    <div class="form-group">
                        <label>分类</label>
                        <select id="accountCategory">
                            <!-- 分类选项动态加载 -->
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label>备注</label>
                        <textarea id="accountNotes" rows="3" placeholder="其他信息..."></textarea>
                    </div>
                    
                    <div class="form-actions">
                        <button type="button" class="btn-secondary" onclick="closeModal('accountModal')">取消</button>
                        <button type="submit" class="btn-primary">保存</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- 添加分类弹窗 -->
        <div class="modal" id="categoryModal">
            <div class="modal-content modal-small">
                <div class="modal-header">
                    <h2>添加分类</h2>
                    <button class="btn-icon" onclick="closeModal('categoryModal')">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <form id="categoryForm" onsubmit="saveCategory(event)">
                    <div class="form-group">
                        <label>分类名称 *</label>
                        <input type="text" id="categoryName" required placeholder="例如：社交媒体">
                    </div>
                    
                    <div class="form-group">
                        <label>图标</label>
                        <div class="icon-picker" id="iconPicker">
                            <span class="icon-option selected" data-icon="📁">📁</span>
                            <span class="icon-option" data-icon="💬">💬</span>
                            <span class="icon-option" data-icon="📧">📧</span>
                            <span class="icon-option" data-icon="💼">💼</span>
                            <span class="icon-option" data-icon="🎮">🎮</span>
                            <span class="icon-option" data-icon="💰">💰</span>
                            <span class="icon-option" data-icon="🛒">🛒</span>
                            <span class="icon-option" data-icon="👨‍💻">👨‍💻</span>
                            <span class="icon-option" data-icon="🎵">🎵</span>
                            <span class="icon-option" data-icon="📱">📱</span>
                            <span class="icon-option" data-icon="🔐">🔐</span>
                            <span class="icon-option" data-icon="⭐">⭐</span>
                        </div>
                    </div>
                    
                    <div class="form-actions">
                        <button type="button" class="btn-secondary" onclick="closeModal('categoryModal')">取消</button>
                        <button type="submit" class="btn-primary">添加</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- 版本历史弹窗 -->
        <div class="modal" id="versionModal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>版本历史</h2>
                    <button class="btn-icon" onclick="closeModal('versionModal')">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <div class="version-list" id="versionList">
                    <!-- 版本列表动态加载 -->
                </div>
            </div>
        </div>

        <!-- 账号详情弹窗 -->
        <div class="modal" id="detailModal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 id="detailTitle">账号详情</h2>
                    <button class="btn-icon" onclick="closeModal('detailModal')">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <div class="account-detail" id="accountDetail">
                    <!-- 详情内容动态加载 -->
                </div>
            </div>
        </div>

        <!-- Toast 提示 -->
        <div class="toast-container" id="toastContainer"></div>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
